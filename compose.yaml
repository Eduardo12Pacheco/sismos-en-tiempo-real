name: realtime-seismic-stream

# Shared application image for every one-shot and long-running service (D19).
x-app: &app
  image: ${SEISMIC_IMAGE:-realtime-seismic-stream:local}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  environment:
    # Container-internal listeners; host clients use localhost:19092/13081.
    # authlib (pulled in by confluent-kafka) warns about its httpx integration on
    # import; silence that third-party deprecation so service logs stay JSON-only.
    PYTHONWARNINGS: "ignore::DeprecationWarning"
    SEISMIC_KAFKA_BOOTSTRAP: redpanda:9092
    SEISMIC_SCHEMA_REGISTRY_URL: http://redpanda:8081
    SEISMIC_CLICKHOUSE_HOST: clickhouse
    SEISMIC_CLICKHOUSE_PORT: "8123"
    SEISMIC_LOG_FORMAT: json
  networks:
    - backend
  restart: "no"

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --default-log-level=info
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s
    networks:
      - backend

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: ${SEISMIC_CLICKHOUSE_USER:-seismic}
      CLICKHOUSE_PASSWORD: ${SEISMIC_CLICKHOUSE_PASSWORD:-seismic-local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    networks:
      - backend

  bootstrap:
    <<: *app
    command: ["bootstrap"]
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  processor:
    <<: *app
    command: ["process"]
    restart: unless-stopped
    environment:
      SEISMIC_KAFKA_BOOTSTRAP: redpanda:9092
      SEISMIC_SCHEMA_REGISTRY_URL: http://redpanda:8081
      SEISMIC_LOG_FORMAT: json
      SEISMIC_STATE_DIR: /var/lib/seismic/state
    volumes:
      - processor-state:/var/lib/seismic/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:9102/readyz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  sink:
    <<: *app
    command: ["sink"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:9103/readyz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      bootstrap:
        condition: service_completed_successfully


  monitor:
    <<: *app
    command: ["monitor"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:9104/readyz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - backend

  grafana:
    image: realtime-seismic-stream-grafana:local
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seismic-live.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # The feature-toggle audit line contains both "error" and "provision"
      # substrings and would pollute provisioning error checks; keep it quiet.
      GF_LOG_FILTERS: featuremgmt:error
      SEISMIC_CLICKHOUSE_USER: ${SEISMIC_CLICKHOUSE_USER:-seismic}
      SEISMIC_CLICKHOUSE_PASSWORD: ${SEISMIC_CLICKHOUSE_PASSWORD:-seismic-local}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker/grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks:
      - backend
      - edge
    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  cli:
    <<: *app
    profiles: ["tools"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  ingest:
    <<: *app
    # Keep the subcommand in the entrypoint so `docker compose run ingest --speed max`
    # appends options to `ingest` instead of replacing the whole command.
    entrypoint: ["seismic-stream", "ingest"]
    command: ["--source", "replay"]
    env_file:
      - path: .env
        required: false
    depends_on:
      bootstrap:
        condition: service_completed_successfully

networks:
  backend:
    internal: true
  edge: {}

volumes:
  redpanda-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  processor-state:
