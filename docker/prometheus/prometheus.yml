# Prometheus scrape configuration for the local seismic pipeline (S13).
# Every service exposes /metrics on its own port; Redpanda exposes its public
# metrics on the admin listener. Scrape and evaluation stay at 5 s so the
# Pipeline Health dashboard reacts quickly to replay runs and outages.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: ["ingest:9101"]

  - job_name: processor
    static_configs:
      - targets: ["processor:9102"]

  - job_name: sink
    static_configs:
      - targets: ["sink:9103"]

  - job_name: monitor
    static_configs:
      - targets: ["monitor:9104"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
