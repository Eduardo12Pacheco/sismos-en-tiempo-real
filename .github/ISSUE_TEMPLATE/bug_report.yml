name: Bug report
description: Report a reproducible defect in the pipeline
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please include enough detail to reproduce it locally.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the defect and the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands, configuration and sample data used.
      placeholder: |
        1. ./install.sh
        2. docker compose run --rm ingest --source replay --speed max
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste JSON log lines or `docker compose logs` output. Remove secrets.
      render: shell
